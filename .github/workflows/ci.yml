name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -timeout 120s ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      # @v8 ships golangci-lint binaries built with Go 1.26+; @v6's
      # cached binary was built with Go 1.24 and refuses to load this
      # repo's go.mod (1.26.2) with "the Go language version used to
      # build golangci-lint is lower than the targeted Go version".
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [build, lint]
    if: ${{ always() && (needs.build.result == 'failure' || needs.lint.result == 'failure') }}
    steps:
      - name: Send Telegram notification on failure
        uses: appleboy/telegram-action@v0.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ CI Failed - terraform-provider-statusharbor

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message }}
            Author: ${{ github.actor }}

            View: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
